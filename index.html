<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kids Tube Santiago - OS System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800;900&display=swap');

        :root {
            --bg-dark: #1b1c20;
            --panel-bg: #22242a;
            --card-bg: #22242a;
            --card-shadow-out: 8px 8px 16px #151619, -8px -8px 16px #2f323b;
            --card-shadow-in: inset 3px 3px 6px #151619, inset -3px -3px 6px #2f323b;
            --neon-cyan: #00FF0D;
            --neon-red: #FF0000;
            --text-primary: #e0e6ed;
            --text-secondary: #7e8b9b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent !important;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            min-height: 100vh;
            padding: 16px 12px 30px 12px;
            color: var(--text-primary);
            transition: filter 0.3s ease;
            overflow-x: hidden;
        }

        /* --- SPLASH SCREEN NEUMÓRFICO --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-dark);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .splash-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            margin-top: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .splash-subtitle {
            font-size: 0.7rem;
            color: var(--neon-cyan);
            letter-spacing: 5px;
            margin-top: 6px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .splash-loader-bar {
            width: 220px;
            height: 18px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--card-shadow-in);
            overflow: hidden;
            position: relative;
            padding: 3px 5px;
            display: flex;
            align-items: center;
        }

        .splash-loader-fill {
            height: 100%;
            width: 0%;
            border-radius: 12px;
            background: repeating-linear-gradient(
                90deg,
                var(--neon-cyan) 0px,
                var(--neon-cyan) 7px,
                transparent 7px,
                transparent 10px
            );
            box-shadow: 0 0 10px rgba(0, 255, 13, 0.5);
            animation: fillProgress 10s linear forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        .splash-status {
            margin-top: 14px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        /* --- MODAL DE INFORMACIÓN / AVISO --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 16, 20, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: var(--card-bg);
            box-shadow: var(--card-shadow-out);
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(0, 255, 13, 0.2);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-img-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--card-shadow-in);
            padding: 4px;
            margin-bottom: 14px;
            background: #000;
        }

        .modal-img-container img {
            width: 100%;
            max-height: 160px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--neon-cyan);
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .modal-text {
            font-size: 0.75rem;
            color: var(--text-primary);
            line-height: 1.4;
            margin-bottom: 14px;
        }

        .modal-text span.warning {
            color: #FFCC00;
            font-weight: 700;
            display: block;
            margin: 6px 0;
        }

        .modal-actions {
            display: flex;
            width: 100%;
            gap: 8px;
            justify-content: space-between;
            margin-top: 4px;
        }

        .modal-btn {
            flex: 1;
            border: none;
            outline: none;
            padding: 10px 4px;
            border-radius: 12px;
            cursor: pointer;
            background: var(--card-bg);
            box-shadow: var(--card-shadow-out);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-primary);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .modal-btn:active {
            box-shadow: var(--card-shadow-in);
            transform: scale(0.96);
        }

        .modal-btn.cyan { color: var(--neon-cyan); }

        /* --- HEADER CONTROL PANEL --- */
        header {
            background: var(--card-bg);
            box-shadow: var(--card-shadow-out);
            padding: 10px 14px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1000px;
            margin: 0 auto 24px auto;
            position: sticky;
            top: 0;
            z-index: 9999;
            gap: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 14px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow-in);
            padding: 4px;
            overflow: hidden;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            pointer-events: none;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        h1 span.tube { color: var(--neon-cyan); }
        h1 span.santiago {
            color: var(--neon-cyan);
            font-size: 0.65rem;
            margin-left: 4px;
            padding: 2px 6px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow-in);
            border-radius: 6px;
            display: inline-block;
        }

        /* --- WIDGET DE BATERÍA ESTILO NEUMÓRFICO --- */
        .battery-widget {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 12px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow-in);
            gap: 2px;
        }

        .battery-label-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.62rem;
            color: var(--text-secondary);
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
        }

        .battery-percentage {
            color: var(--neon-cyan);
            font-weight: 800;
        }

        .battery-bar-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .lightning-icon {
            width: 10px;
            height: 10px;
            fill: var(--neon-cyan);
            filter: drop-shadow(0 0 3px var(--neon-cyan));
        }

        .battery-blocks-container {
            width: 65px;
            height: 12px;
            background: #151619;
            border-radius: 6px;
            padding: 2px;
            box-shadow: inset 1px 1px 3px #0d0e10, inset -1px -1px 3px #23262d;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        .battery-blocks-fill {
            height: 100%;
            width: 68%;
            border-radius: 4px;
            background: repeating-linear-gradient(
                90deg,
                var(--neon-cyan) 0px,
                var(--neon-cyan) 4px,
                transparent 4px,
                transparent 6px
            );
            box-shadow: 0 0 6px rgba(0, 255, 13, 0.7);
            transition: width 0.4s ease;
        }

        .btn-back {
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            box-shadow: var(--card-shadow-out);
            border-radius: 12px;
            padding: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-back img {
            height: 30px;
            width: auto;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 0 2px var(--neon-cyan));
        }

        .btn-back:active { 
            box-shadow: var(--card-shadow-in);
            transform: scale(0.95); 
        }

        .btn-back.visible { display: inline-flex; }

        /* --- CARDS SYSTEM --- */
        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .container.single-column {
            grid-template-columns: 1fr;
            max-width: 480px;
            margin: 20px auto 0 auto;
            gap: 25px;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            box-shadow: var(--card-shadow-out);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
            width: 100%;
            scroll-margin-top: 90px;
            /* Borde verde neón tenue para coincidir con la ventana emergente */
            border: 1px solid rgba(0, 255, 13, 0.2);
        }

        .video-wrapper {
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            box-shadow: var(--card-shadow-in);
            padding: 4px;
            position: relative;
        }

        video {
            width: 100%;
            aspect-ratio: 9/16;
            object-fit: cover;
            border-radius: 14px;
            display: block;
            accent-color: #FF0000 !important;
        }

        /* --- CONTROLES HTML5 EN ROJO --- */
        video::-webkit-media-controls-panel {
            background: linear-gradient(transparent, rgba(0,0,0,0.8)) !important;
        }

        video::-webkit-media-controls-play-button,
        video::-webkit-media-controls-overlay-play-button {
            filter: drop-shadow(0px 0px 6px #FF0000) sepia(100%) saturate(10000%) hue-rotate(330deg) !important;
        }

        video::-webkit-media-controls-timeline {
            accent-color: #FF0000 !important;
            filter: drop-shadow(0px 0px 3px #FF0000) !important;
        }

        video::-webkit-media-controls-timeline-container {
            accent-color: #FF0000 !important;
        }

        video::-webkit-media-controls-current-time-display,
        video::-webkit-media-controls-time-remaining-display,
        video::-webkit-media-controls-mute-button,
        video::-webkit-media-controls-toggle-closed-captions-button,
        video::-webkit-media-controls-fullscreen-button,
        video::-internal-media-controls-overflow-button,
        video::-webkit-media-controls-overflow-menu-list,
        video::-webkit-media-controls-overflow-button {
            filter: drop-shadow(0px 0px 4px #FF0000) sepia(100%) saturate(10000%) hue-rotate(330deg) !important;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            margin: 14px 0 10px 0;
            color: var(--text-primary);
            text-align: center;
            letter-spacing: 0.5px;
        }

        .status-badge {
            font-size: 0.68rem;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 12px;
            margin-bottom: 12px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--card-bg);
            box-shadow: var(--card-shadow-in);
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .led-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-online { color: var(--neon-cyan); }
        .status-online .led-dot { background: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }

        .status-offline { color: #00FF0D; }
        .status-offline .led-dot { background: #00FF0D; box-shadow: 0 0 8px #00FF0D; }

        .status-loading { color: var(--neon-cyan); }
        .status-loading .led-dot { background: var(--neon-cyan); animation: blink 0.8s infinite; }

        @keyframes blink { 50% { opacity: 0.2; } }

        .btn-neu {
            width: 100%;
            border: none;
            outline: none;
            padding: 10px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            box-shadow: var(--card-shadow-out);
            transition: all 0.2s ease;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--neon-cyan);
            min-height: 52px;
        }

        .btn-neu img {
            max-height: 32px;
            width: auto;
            object-fit: contain;
            display: block;
            pointer-events: none;
            filter: drop-shadow(0 0 3px var(--neon-cyan));
        }

        .btn-neu:active { 
            box-shadow: var(--card-shadow-in); 
            transform: scale(0.98);
        }
        .btn-neu:disabled { opacity: 1; cursor: not-allowed; box-shadow: var(--card-shadow-in); }

        /* --- BARRA DE DESCARGA VISUAL (SIN TEXTO) --- */
        .btn-download-bar-container {
            width: 80%;
            height: 16px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--card-shadow-in);
            overflow: hidden;
            padding: 3px;
            display: flex;
            align-items: center;
        }

        .btn-download-bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 12px;
            background: repeating-linear-gradient(
                90deg,
                var(--neon-cyan) 0px,
                var(--neon-cyan) 6px,
                transparent 6px,
                transparent 9px
            );
            box-shadow: 0 0 8px rgba(0, 255, 13, 0.6);
            transition: width 0.2s ease;
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN DE 10 SEGUNDOS -->
    <div id="splash-screen">
        <div class="splash-title">KIDS TUBE <span style="color: var(--neon-cyan);">SANTIAGO</span></div>
        <div class="splash-subtitle">SYSTEM OS V2.5</div>
        <div class="splash-loader-bar">
            <div class="splash-loader-fill"></div>
        </div>
        <div class="splash-status" id="splash-status-text">Iniciando interfaz cuántica...</div>
    </div>

    <!-- MODAL POP-UP DE AVISO -->
    <div class="modal-overlay" id="welcome-modal">
        <div class="modal-box">
            <div class="modal-img-container">
                <img id="modal-banner" src="" alt="Banner Kids Tube Santiago">
            </div>
            <div class="modal-title">Kids Tube Santiago</div>
            <div class="modal-text">
                Bienvenido al sistema interactivo de entretenimiento.
                <span class="warning">⚠️ ¡ATENCIÓN! Esta aplicación es totalmente GRATUITA.</span>
                Queda estrictamente prohibida su venta.
            </div>
            <div class="modal-actions">
                <button class="modal-btn" onclick="closeModal()">LUEGO</button>
                <a class="modal-btn cyan" href="https://chat.whatsapp.com" target="_blank">WHATSAPP</a>
                <a class="modal-btn cyan" href="https://t.me" target="_blank">TELEGRAM</a>
            </div>
        </div>
    </div>

    <header>
        <div class="logo-container">
            <div class="logo-icon">
                <img id="app-logo" src="" alt="Logo" draggable="false">
            </div>
            <h1>Kids<span class="tube">Tube</span> <span class="santiago">Santiago</span></h1>
        </div>

        <div class="battery-widget">
            <div class="battery-label-row">
                <span>Electricity:</span>
                <span class="battery-percentage" id="battery-text">68%</span>
            </div>
            <div class="battery-bar-row">
                <svg class="lightning-icon" viewBox="0 0 24 24">
                    <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                </svg>
                <div class="battery-blocks-container">
                    <div class="battery-blocks-fill" id="battery-fill"></div>
                </div>
            </div>
        </div>

        <button class="btn-back" id="btn-back" onclick="resetLayout()">
            <img id="img-btn-back" src="" alt="Volver" draggable="false">
        </button>
    </header>

    <div class="container" id="video-list"></div>

    <script>
        function closeModal() {
            document.getElementById("welcome-modal").classList.remove("active");
        }

        function initBatteryMonitor() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    const updateBatteryUI = () => {
                        const level = Math.round(battery.level * 100);
                        document.getElementById('battery-text').innerText = level + '%';
                        document.getElementById('battery-fill').style.width = level + '%';
                    };
                    updateBatteryUI();
                    battery.addEventListener('levelchange', updateBatteryUI);
                });
            }
        }
        initBatteryMonitor();

        const splashMessages = [
            "Estableciendo enlace seguro...",
            "Inicializando base de datos local...",
            "Sincronizando nodos multimedia...",
            "Compilando interfaz de control HUD...",
            "Optimizando flujo de datos...",
            "Sistema Neo Tube Operativo."
        ];

        let msgIdx = 0;
        const statusText = document.getElementById("splash-status-text");
        const msgInterval = setInterval(() => {
            if (msgIdx < splashMessages.length) {
                statusText.innerText = splashMessages[msgIdx];
                msgIdx++;
            }
        }, 1600);

        setTimeout(() => {
            clearInterval(msgInterval);
            document.getElementById("splash-screen").classList.add("hidden");
            document.getElementById("welcome-modal").classList.add("active");
        }, 10000);

        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.key === 'PrintScreen' || e.keyCode === 44 || e.keyCode === 123 || 
               (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) || 
               (e.ctrlKey && ['U', 'P'].includes(e.key.toUpperCase()))) {
                e.preventDefault();
                return false;
            }
        });

        window.addEventListener('blur', () => { document.body.style.filter = 'blur(25px)'; });
        window.addEventListener('focus', () => { document.body.style.filter = 'none'; });

        const LOGO_URL = "https://dl.dropboxusercontent.com/scl/fi/63x8iyp2ilhhidufxudtq/Orange-and-Black-Modern-Professional-Electrician-Services-Instagram-Post_20260907_234742_0000.png?rlkey=5jh874gpqqt1u26f3sdostnqa&st=0mreg1lc&dl=1";
        const BACK_IMG_URL = "https://dl.dropboxusercontent.com/scl/fi/to8uu9wehmvk22d9kwf8m/20260913_225429_0000.png?rlkey=unmcbysh86xhstsalk1p2nslt&st=c4xog1rs&dl=1";
        const SAVE_IMG_URL = "https://dl.dropboxusercontent.com/scl/fi/9fvzn8udo7amdy26ckt7l/20260914_071132_0000.png?rlkey=ufa6tjnt1v7tqmk7ig12fwuev&st=8f0olr0f&dl=1";

        function getDirectDropboxUrl(url) {
            if (!url) return "";
            let directUrl = url.trim();
            directUrl = directUrl.replace("www.dropbox.com", "dl.dropboxusercontent.com");
            directUrl = directUrl.replace("dropbox.com", "dl.dropboxusercontent.com");
            
            if (directUrl.includes("dl=0")) {
                directUrl = directUrl.replace("dl=0", "raw=1");
            } else if (!directUrl.includes("raw=1")) {
                directUrl = directUrl.replace("dl=1", "raw=1");
                if (!directUrl.includes("raw=1")) {
                    directUrl += (directUrl.includes("?") ? "&" : "?") + "raw=1";
                }
            }
            return directUrl;
        }

        const rawUrls = [
            "https://dl.dropboxusercontent.com/scl/fi/h15ofg5bokmedcbszdn9r/AllVideo_01788809695611.mp4?rlkey=2deddn9u2gs2zgasn66c389ew&st=3ydfmhms&dl=1",
            "https://dl.dropboxusercontent.com/scl/fi/wfx31x9fusn7a18y7fdmp/AllVideo_01788810426795.mp4?rlkey=47tvovbmoo8s1nwtyraa5eyrf&st=9p27biht&dl=1",
            "https://dl.dropboxusercontent.com/scl/fi/p08bd4dzy9x9raf6m7tc5/AllVideo_01788810354272.mp4?rlkey=et7yv83c9uk9o3s2uwumyyiip&st=evgxbm1q&dl=1",
            "https://dl.dropboxusercontent.com/scl/fi/oenv1lben4godll95yqn5/AllVideo_01788824389637.mp4?rlkey=wib7j10eqfnh56qmvaa7b0m92&st=22gh1bnq&dl=1",

            "https://www.dropbox.com/scl/fi/jpkvwiw0waul0aw7tosvq/AllVideo_01789514925478.mp4?rlkey=k0va99iw846ng0x6hnj03qmnj&st=rpdgw6b2&dl=1",
            "https://www.dropbox.com/scl/fi/kv64kz1mumvahb9p4pvwr/AllVideo_01789514361626.mp4?rlkey=6c90fj2klfznlhc4izcu5igqx&st=73c77o4g&dl=1",
            "https://www.dropbox.com/scl/fi/yl7qmvqfjg3fwqwbirfh5/AllVideo_01789514253094.mp4?rlkey=15ynnap1alsa6ie2krcv359cv&st=uhuhk02z&dl=1",
            "https://www.dropbox.com/scl/fi/90t8hkdnq5o5jmf4g3znv/AllVideo_01789514221760.mp4?rlkey=q4vadj7b93jp0lxn14p4hlkfz&st=1x3ojhu5&dl=1"
        ];

        const playlist = rawUrls.map((url, i) => ({
            id: `dropbox_video_${i + 1}`,
            title: `🎬 Video Especial ${i + 1}`,
            url: getDirectDropboxUrl(url)
        }));

        let db;
        let observer;
        let userHasInteracted = false;
        const objectUrls = new Map();
        let cachedSaveImgUrl = "";

        function setVideoBlobSource(videoElement, blob, key) {
            if (objectUrls.has(key)) URL.revokeObjectURL(objectUrls.get(key));
            const newUrl = URL.createObjectURL(blob);
            objectUrls.set(key, newUrl);
            videoElement.src = newUrl + "#t=0.1";
        }

        function unlockAudio() {
            if (!userHasInteracted) {
                userHasInteracted = true;
                document.querySelectorAll("video").forEach(v => { v.muted = false; });
                window.removeEventListener('touchstart', unlockAudio);
                window.removeEventListener('click', unlockAudio);
            }
        }

        window.addEventListener('touchstart', unlockAudio, { passive: true });
        window.addEventListener('click', unlockAudio, { passive: true });

        const request = indexedDB.open("KidsTubeFuturisticDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("videos")) db.createObjectStore("videos");
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            cacheAppImages();
            renderApp();
            initAutoPlayOnScroll();
        };

        function cacheAppImages() {
            const logoImg = document.getElementById("app-logo");
            const backImg = document.getElementById("img-btn-back");
            const bannerImg = document.getElementById("modal-banner");

            const checkAndCache = (dbKey, remoteUrl, targetElement) => {
                const tx = db.transaction(["videos"], "readonly");
                const store = tx.objectStore("videos");
                const getRequest = store.get(dbKey);

                getRequest.onsuccess = () => {
                    if (getRequest.result) {
                        const blobUrl = URL.createObjectURL(getRequest.result);
                        if (targetElement) targetElement.src = blobUrl;
                        if (dbKey === "app_save_image") cachedSaveImgUrl = blobUrl;
                    } else {
                        const directUrl = getDirectDropboxUrl(remoteUrl);
                        if (targetElement) targetElement.src = directUrl;
                        fetch(directUrl)
                            .then(res => res.blob())
                            .then(blob => {
                                const saveTx = db.transaction(["videos"], "readwrite");
                                saveTx.objectStore("videos").put(blob, dbKey);
                                saveTx.oncomplete = () => {
                                    const blobUrl = URL.createObjectURL(blob);
                                    if (targetElement) targetElement.src = blobUrl;
                                    if (dbKey === "app_save_image") cachedSaveImgUrl = blobUrl;
                                };
                            }).catch(() => {});
                    }
                };
            };

            checkAndCache("app_logo_image", LOGO_URL, logoImg);
            checkAndCache("app_back_image", BACK_IMG_URL, backImg);
            checkAndCache("app_save_image", SAVE_IMG_URL, null);
            checkAndCache("app_logo_image", LOGO_URL, bannerImg);
        }

        function renderApp() {
            const container = document.getElementById("video-list");
            container.innerHTML = "";

            playlist.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="video-wrapper">
                        <video id="player-${item.id}" controls playsinline preload="metadata" onplay="handleVideoPlay(this)" onended="handleVideoEnd(this, ${index})"></video>
                    </div>
                    <div class="card-title">${item.title}</div>
                    <div class="status-badge status-online" id="status-${item.id}">
                        <span class="led-dot"></span> <span class="badge-text">STREAM ONLINE</span>
                    </div>
                    <button class="btn-neu btn-download" id="btn-${item.id}" onclick="toggleDownload('${item.id}', '${item.url}')">
                        <img src="${cachedSaveImgUrl || getDirectDropboxUrl(SAVE_IMG_URL)}" alt="Guardar" draggable="false">
                    </button>
                `;
                container.appendChild(card);
                checkVideoStatus(item.id, item.url);
            });
        }

        function initAutoPlayOnScroll() {
            observer = new IntersectionObserver((entries) => {
                const container = document.getElementById("video-list");
                if (!container.classList.contains("single-column")) return;

                entries.forEach(entry => {
                    const video = entry.target.querySelector("video");
                    if (entry.isIntersecting && video) {
                        video.muted = !userHasInteracted;
                        video.play().catch(() => {});
                    } else if (video) {
                        video.pause();
                    }
                });
            }, { rootMargin: '-20% 0px -20% 0px', threshold: 0.6 });

            setTimeout(() => {
                document.querySelectorAll(".card").forEach(card => observer.observe(card));
            }, 300);
        }

        function handleVideoPlay(currentVideo) {
            unlockAudio();
            const container = document.getElementById("video-list");
            const btnBack = document.getElementById("btn-back");

            document.querySelectorAll("video").forEach(v => { if (v !== currentVideo) v.pause(); });

            const isFirst = !container.classList.contains("single-column");
            container.classList.add("single-column");
            btnBack.classList.add("visible");

            if (isFirst) {
                setTimeout(() => { currentVideo.closest('.card').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
            }
        }

        function handleVideoEnd(video, currentIndex) {
            video.currentTime = 0;
            video.pause();
            const nextIndex = currentIndex + 1;
            if (nextIndex < playlist.length) {
                const nextPlayer = document.getElementById(`player-${playlist[nextIndex].id}`);
                if (nextPlayer) {
                    nextPlayer.closest('.card').scrollIntoView({ behavior: 'smooth', block: 'center' });
                    nextPlayer.muted = false;
                    nextPlayer.play().catch(() => {});
                }
            } else resetLayout();
        }

        function resetLayout() {
            const container = document.getElementById("video-list");
            const btnBack = document.getElementById("btn-back");
            document.querySelectorAll("video").forEach(v => { v.pause(); v.currentTime = 0; });
            container.classList.remove("single-column");
            btnBack.classList.remove("visible");
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function checkVideoStatus(id, remoteUrl) {
            const tx = db.transaction(["videos"], "readonly");
            const store = tx.objectStore("videos");
            const req = store.get(id);

            req.onsuccess = () => {
                const player = document.getElementById(`player-${id}`);
                const btn = document.getElementById(`btn-${id}`);
                const status = document.getElementById(`status-${id}`);

                if (req.result) {
                    setVideoBlobSource(player, new Blob([req.result], { type: 'video/mp4' }), id);
                    player.load();
                    status.innerHTML = `<span class="led-dot"></span> <span class="badge-text">LOCAL OFFLINE</span>`;
                    status.className = "status-badge status-offline";
                    btn.style.display = "none";
                } else {
                    player.src = getDirectDropboxUrl(remoteUrl) + "#t=0.1";
                    status.innerHTML = `<span class="led-dot"></span> <span class="badge-text">STREAM ONLINE</span>`;
                    status.className = "status-badge status-online";
                    btn.style.display = "flex";
                    btn.innerHTML = `<img src="${cachedSaveImgUrl || getDirectDropboxUrl(SAVE_IMG_URL)}" alt="Guardar" draggable="false">`;
                    btn.className = "btn-neu btn-download";
                }
            };
        }

        function toggleDownload(id, url) {
            const btn = document.getElementById(`btn-${id}`);
            const status = document.getElementById(`status-${id}`);
            const tx = db.transaction(["videos"], "readonly");
            const req = tx.objectStore("videos").get(id);

            req.onsuccess = () => {
                if (req.result) {
                    const delTx = db.transaction(["videos"], "readwrite");
                    delTx.objectStore("videos").delete(id);
                    delTx.oncomplete = () => {
                        if (objectUrls.has(id)) URL.revokeObjectURL(objectUrls.get(id));
                        checkVideoStatus(id, url);
                    };
                } else {
                    btn.disabled = true;
                    status.className = "status-badge status-loading";
                    status.innerHTML = `<span class="led-dot"></span> <span class="badge-text">DESCARGANDO...</span>`;
                    
                    btn.innerHTML = `
                        <div class="btn-download-bar-container">
                            <div class="btn-download-bar-fill" id="bar-fill-${id}"></div>
                        </div>
                    `;

                    let downloadUrl = getDirectDropboxUrl(url).replace("dl=1", "raw=1");

                    const xhr = new XMLHttpRequest();
                    xhr.open("GET", downloadUrl, true);
                    xhr.responseType = "blob";

                    xhr.onprogress = (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            const fillElem = document.getElementById(`bar-fill-${id}`);
                            if (fillElem) fillElem.style.width = percent + "%";
                        }
                    };

                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            const blob = xhr.response;
                            const saveTx = db.transaction(["videos"], "readwrite");
                            saveTx.objectStore("videos").put(new Blob([blob], { type: 'video/mp4' }), id);
                            saveTx.oncomplete = () => {
                                btn.disabled = false;
                                checkVideoStatus(id, url);
                            };
                        } else {
                            alert("No se pudo guardar offline debido a restricciones del servidor (Error 403/CORS). El video continuará disponible en streaming.");
                            btn.disabled = false;
                            checkVideoStatus(id, url);
                        }
                    };

                    xhr.onerror = () => {
                        alert("Ocurrió un error al intentar descargar el video.");
                        btn.disabled = false;
                        checkVideoStatus(id, url);
                    };

                    xhr.send();
                }
            };
        }
    </script>
</body>
</html>
